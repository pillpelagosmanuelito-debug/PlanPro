name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  quality:
    name: Analisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analisis estatico
        run: flutter analyze

      - name: Pruebas
        run: flutter test --reporter expanded

  android:
    name: APK de depuracion
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Icono de la aplicacion
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_icon.py

      - name: Preparar plataforma Android
        run: bash tool/prepare_android.sh

      - name: Construir APK
        run: flutter build apk --release

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: project-management-simulator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publicar version
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: project-management-simulator-apk
          path: dist

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-release.apk
          generate_release_notes: true
